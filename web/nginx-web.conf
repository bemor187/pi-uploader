# web Pi: static host for HTML games and files.
#   /srv/web/            site root (index.html)
#   /srv/web/games/<x>/  one folder per HTML game  -> http://web/games/<x>/
#   /srv/web/files/      anything to share         -> http://web/files/ (directory listing)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/web;
    index index.html;
    charset utf-8;

    # .wasm is served as application/wasm: setup.sh adds it to /etc/nginx/mime.types if missing
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"web":"ok"}';
    }

    location /games/ {
        autoindex on;
        try_files $uri $uri/ =404;
        # some engines (Godot 4 threads, Unity WebGL threads) need cross-origin isolation
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    location /files/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}
