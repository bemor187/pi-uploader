# web Pi: PI//GRID hub + static host for HTML games and files.
#   /srv/web/            site root (hub: index.html, assets/, dash/, queue/, tdt/, hub/)
#   /srv/web/games/<x>/  one folder per HTML game  -> http://web/games/<x>/
#   /srv/web/files/      anything to share         -> http://web/files/ (directory listing)
#   /api/...             read-only proxies to brain, lanes and overseer for the dashboard
# Tokens never live in this file. scripts/web-hub.sh writes /etc/nginx/web-hub/*.conf from
# /etc/uploader.env (root-only, mode 600). Missing includes are fine: the globs match nothing
# and the dashboard falls back to the unauthenticated /health endpoints.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/web;
    index index.html;
    charset utf-8;

    # .wasm is served as application/wasm: setup.sh adds it to /etc/nginx/mime.types if missing
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Tailscale MagicDNS, resolved per request so a Pi that's down at nginx start can't break the config.
    # $hub_suffix (".<tailnet>.ts.net") comes from /etc/nginx/web-hub/env.conf (written by web-hub.sh).
    resolver 100.100.100.100 valid=30s ipv6=off;
    resolver_timeout 3s;
    set $hub_suffix "";
    include /etc/nginx/web-hub/env*.conf;
    # proxied Pi unreachable -> @hub_down (below); only the /api/ locations proxy anything
    proxy_intercept_errors on;
    error_page 502 503 504 = @hub_down;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"web":"ok"}';
    }

    location /games/ {
        autoindex on;
        try_files $uri $uri/ =404;
        # some engines (Godot 4 threads, Unity WebGL threads) need cross-origin isolation
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    location /files/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /tdt/ {
        try_files $uri $uri/ =404;
        location ~* \.(png|wav|js|json)$ { expires 1h; }
    }

    # hub status files written by web-hub.sh (config.json = which tokens exist, never the tokens)
    location /hub/ {
        add_header Cache-Control "no-store" always;
        if ($http_tailscale_funnel_request) { return 403; }
        try_files $uri =404;
    }

    # ---------------------------------------------------------------- read-only API proxies
    # GET only, fixed paths only: the injected tokens can read status but never upload, retry or act.
    # Funnel (public) requests are refused so tokens can't be used from outside the tailnet.
    # a Pi that's down answers 200 {"_hub_down":...} so the dashboard shows DOWN without browser console noise
    location @hub_down {
        default_type application/json;
        return 200 '{"_hub_down":"upstream unreachable"}';
    }
    location /api/ {
        default_type application/json;
        return 404 '{"error":"unknown api path"}';
    }
    location = /api/brain/health {
        limit_except GET { deny all; }
        if ($http_tailscale_funnel_request) { return 403; }
        proxy_pass http://brain$hub_suffix/health;
        proxy_connect_timeout 4s; proxy_read_timeout 12s;
    }
    location = /api/brain/jobs {
        limit_except GET { deny all; }
        if ($http_tailscale_funnel_request) { return 403; }
        proxy_set_header Authorization "";
        include /etc/nginx/web-hub/brain-auth*.conf;
        proxy_pass http://brain$hub_suffix/jobs$is_args$args;
        proxy_connect_timeout 4s; proxy_read_timeout 12s;
    }
    location ~ ^/api/lane/(?<lane>tiktok|insta|clapper)/health$ {
        limit_except GET { deny all; }
        if ($http_tailscale_funnel_request) { return 403; }
        proxy_pass http://$lane$hub_suffix:8100/health;
        proxy_connect_timeout 4s; proxy_read_timeout 8s;
    }
    location = /api/overseer/health {
        limit_except GET { deny all; }
        if ($http_tailscale_funnel_request) { return 403; }
        proxy_pass http://overseer$hub_suffix:8200/health;
        proxy_connect_timeout 4s; proxy_read_timeout 12s;
    }
    location = /api/overseer/fleet {
        limit_except GET { deny all; }
        if ($http_tailscale_funnel_request) { return 403; }
        proxy_set_header Authorization "";
        include /etc/nginx/web-hub/overseer-auth*.conf;
        proxy_pass http://overseer$hub_suffix:8200/fleet;
        proxy_connect_timeout 4s; proxy_read_timeout 12s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}
